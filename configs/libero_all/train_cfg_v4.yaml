# V4: V2.2 fusion/regression head with SigLIP Base patch16-224 encoders.
model:
  backbone: models/siglip-base-patch16-224
  revision: 7fd15f0689c79d79e38b1c2e2e2370a7bf2761ed
  backend: siglip
  image_size: 224
  hidden_dim: 256
  layers: 32
  heads: 4
  chunk_size: 12
  dropout: 0.1
  fusion_layers: 6
  state_dim: 8
  action_dim: 7
  cameras: 2
  train_vision_encoder: true
  action_head: regression
data:
  directory: data
  pattern: 'libero_[sog1]*/*_demo.hdf5'
  flip_vertical: true
  dataset: libero
train:
  output_dir: outputs/train/libero_all_v4
  device: cuda
  precision: fp16
  batch_size: 8
  grad_accumulation: 8
  workers: 2
  steps: 40000
  lr: 0.0001
  weight_decay: 0.001
  warmup_steps: 500
  grad_clip: 1.0
  save_every: 8000
  log_every: 20
  seed: 42
  image_shift: 0
  color_jitter: 0.0
  ema_decay: 0.999
  vision_lr: 0.00001
