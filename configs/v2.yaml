# V2: LIBERO-Spatial by default; use --dataset metaworld for MT50.
# Run commands from the project root.
model:
  backbone: models/clip-vit-base-patch16
  revision: 57c216476eefef5ab752ec549e440a49ae4ae5f3
  backend: clip
  image_size: 224
  hidden_dim: 256
  layers: 4
  heads: 8
  chunk_size: 8
  dropout: 0.1
  fusion_layers: 2
  state_dim: 8
  action_dim: 7
  cameras: 2
data:
  directory: data/libero_spatial
  pattern: '*_demo.hdf5'
  val_fraction: 0.1
  flip_vertical: true
  dataset: libero
train:
  output_dir: runs/libero_spatial_v2
  device: cuda
  precision: fp16
  batch_size: 4
  grad_accumulation: 4
  workers: 2
  steps: 30000
  lr: 0.0001
  weight_decay: 0.001
  warmup_steps: 500
  grad_clip: 1.0
  validate_every: 500
  validation_batches: 50
  save_every: 1000
  log_every: 20
  seed: 42
  image_shift: 4
  color_jitter: 0.1
