[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myvla"
version = "0.1.0"
description = "A small PyTorch language-conditioned action-chunk policy for LIBERO"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch==2.6.0", "transformers==4.57.6", "numpy==1.26.4",
  "h5py>=3.11,<4", "pillow>=10.4,<12", "pyyaml>=6.0.2,<7",
  "matplotlib>=3.8,<3.11",
]

[project.optional-dependencies]
mt50 = [
  "metaworld==3.0.0", "mujoco==3.3.0", "gymnasium==1.1.1",
  "pyarrow>=18,<20", "imageio[ffmpeg]>=2.34,<3",
]
sim = [
  "robosuite==1.4.1", "mujoco==2.3.7", "bddl==1.0.1", "termcolor>=2,<4",
  "gym==0.26.2", "numba>=0.59,<0.62", "easydict>=1.9,<2",
  "cloudpickle>=2.2,<4", "imageio[ffmpeg]>=2.34,<3",
  "future>=0.18.3,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<0.12"]

[tool.uv]
conflicts = [[{ extra = "sim" }, { extra = "mt50" }]]

[project.scripts]
myvla = "myvla.cli:main"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-plugin-autoload"
